name: Tests (menu + gameplay)

# Приёмочные автотесты в РЕАЛЬНОМ Unity (Play Mode), без человека:
#   • меню: EventSystem, модуль ввода с назначенными actions, видимый курсор, попадание raycast
#           в каждую кнопку, РЕАЛЬНЫЙ клик виртуальной мышью (Input System -> Button.onClick),
#           навигация с клавиатуры (↑/↓/Enter), переход меню -> игра;
#   • геймплей: сцена грузится, время/деньги/розыск/погода/миссии/гараж работают, игрок двигается,
#               пауза и возврат в игру, ни одного исключения в логе.
#
# Тесты лежат в Assets/Tests/PlayMode и запускаются штатным Unity Test Framework
# (`-runTests -testPlatform PlayMode`), результат — XML в build/test-results. Ненулевой код
# возврата Unity = красный job = сборка не выпускается.

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.29f1
  PROJECT_PATH: .
  UNITY_IMAGE: unityci/editor:ubuntu-6000.3.29f1-windows-mono-4.0.0

jobs:
  smoke:
    name: Unity smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Tests-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Tests-
            Library-${{ env.UNITY_VERSION }}-Windows-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install GameCI CLI
        run: |
          set -euo pipefail
          VERSION=v0.1.77
          curl -fsSL --retry 3 -o /tmp/game-ci.tar.gz \
            "https://github.com/game-ci/cli/releases/download/$VERSION/game-ci-linux-x64.tar.gz"
          mkdir -p "$HOME/.game-ci"
          tar -xzf /tmp/game-ci.tar.gz -C "$HOME/.game-ci"
          echo "$HOME/.game-ci" >> "$GITHUB_PATH"
          "$HOME/.game-ci/game-ci" --version

      - name: Activate Unity (Personal seat via account)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci activate --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-4.0.0

      # 1) Подготовка проекта без сборки: URP-ассеты, префабы, сцена, настройки.
      - name: Prepare project
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          game-ci build --engine unity --projectPath "$PROJECT_PATH" \
            --targetPlatform StandaloneWindows64 \
            --buildMethod NeonDistrict.EditorTools.CIBuild.PrepareOnly \
            --buildsPath build --skipActivation \
            --customImage "$UNITY_IMAGE"

      # 2) Play Mode-тесты штатным раннером Unity. Свой docker run (а не `game-ci build`),
      #    потому что game-ci добавляет -quit, который убивает редактор до запуска Play Mode.
      #    Лицензия уже лежит в ~/.config/unity3d (её положила `game-ci activate`), каталог
      #    монтируется в контейнер как /root — поэтому --skipActivation.
      - name: Run Play Mode tests
        run: |
          set -uo pipefail
          # build/ создан контейнером от root — забираем владение, иначе не создать подкаталог
          sudo mkdir -p build/test-results
          sudo chown -R "$(id -u):$(id -g)" build

          docker run --rm --network host \
            -v "$PWD":/github/workspace \
            -v "$HOME/.config/unity3d":"/root/.config/unity3d" \
            -w /github/workspace \
            "$UNITY_IMAGE" \
            unity-editor \
              -batchmode -nographics \
              -projectPath /github/workspace \
              -runTests -testPlatform PlayMode \
              -testResults /github/workspace/build/test-results/playmode.xml \
              -logFile /github/workspace/build/test-results/editor.log
          RC=$?
          echo "unity exit code: $RC"

          if [ -f build/test-results/editor.log ]; then
            echo "::group::Editor.log (последние 200 строк)"
            tail -200 build/test-results/editor.log
            echo "::endgroup::"
          fi
          exit $RC

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('build/test-results/*.xml')
          if not files:
              print('::error::нет файла результатов тестов')
              raise SystemExit(1)
          for f in files:
              r = ET.parse(f).getroot()
              print(f"{f}: total={r.get('total')} passed={r.get('passed')} failed={r.get('failed')}")
              for tc in r.iter('test-case'):
                  mark = '✓' if tc.get('result') == 'Passed' else '✗'
                  print(f"  {mark} {tc.get('name')}  [{tc.get('result')}]")
                  for msg in tc.iter('message'):
                      for line in (msg.text or '').strip().splitlines():
                          print('     ', line)
          failed = sum(int(ET.parse(f).getroot().get('failed', 0)) for f in files)
          if failed:
              print(f'::error::провалено тестов: {failed}')
              raise SystemExit(1)
          PY

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-log
          path: |
            build/test-results/**
            build/**/Editor.log
            **/Editor.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Return Unity license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci return-license --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-4.0.0 || true
