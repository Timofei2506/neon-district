name: Build (Windows / Linux)

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      unity_version:
        description: 'Версия Unity (например 6000.3.29f1)'
        required: false
        default: '6000.3.29f1'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: ${{ github.event.inputs.unity_version || '6000.3.29f1' }}
  PROJECT_PATH: '.'

jobs:
  # ---------------------------------------------------------------- Windows
  build-windows:
    name: Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false           # модели хранятся обычным git; при переходе на LFS поставьте true
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Windows-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Windows-
            Library-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null || true
          df -h /

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          projectPath: ${{ env.PROJECT_PATH }}
          buildMethod: NeonDistrict.EditorTools.CIBuild.BuildWindows
          allowDirtyBuild: true
          artifactsPath: build-windows

      - name: Zip build
        if: always()
        run: |
          if [ -d build-windows ]; then
            cd build-windows
            zip -r ../NeonDistrict-Windows.zip . || true
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonDistrict-Windows
          path: |
            build-windows/**
            NeonDistrict-Windows.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload editor log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log-windows
          path: |
            ~/.config/unity3d/Editor.log
            **/Editor.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Linux
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Linux-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Linux-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          projectPath: ${{ env.PROJECT_PATH }}
          buildMethod: NeonDistrict.EditorTools.CIBuild.BuildLinux
          allowDirtyBuild: true
          artifactsPath: build-linux

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonDistrict-Linux
          path: build-linux/**
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------- Release
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack release
        run: |
          mkdir -p out
          if [ -f artifacts/NeonDistrict-Windows/NeonDistrict-Windows.zip ]; then
            cp artifacts/NeonDistrict-Windows/NeonDistrict-Windows.zip out/
          else
            (cd artifacts/NeonDistrict-Windows 2>/dev/null && zip -r ../../out/NeonDistrict-Windows.zip . ) || true
          fi
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Neon District ${{ github.ref_name }}
          body: |
            Автоматическая сборка из коммита ${{ github.sha }}.
            Windows x64 — распакуйте архив и запустите `NeonDistrict.exe`.
          files: out/*
          draft: false
          prerelease: false
