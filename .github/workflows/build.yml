name: Build (Windows / Linux)

# Сборка десктопных билдов Unity 6.3 LTS.
#
# АКТИВАЦИЯ (см. README → CI/CD):
#   Unity 6 + Personal  → UNITY_EMAIL + UNITY_PASSWORD (файл .ulf НЕ подходит: он привязан
#                         к машине и в облаке даёт «Machine bindings don't match»)
#   Unity Pro/Plus      → UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD
# Дополнительно: каждый прогон занимает одно Personal-место на аккаунте; game-ci
# возвращает его в конце (шаг return license), поэтому параллельные прогоны не запускайте.

on:
  push:
    branches: [master, main]
    tags: ['v*']
    # документацию собирать незачем: Unity-образ ~20 ГБ и один Personal-seat на прогон
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      unity_version:
        description: 'Версия Unity (например 6000.3.29f1)'
        required: false
        default: '6000.3.29f1'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: ${{ github.event.inputs.unity_version || '6000.3.29f1' }}
  PROJECT_PATH: '.'

jobs:
  # ---------------------------------------------------------------- Tests gate
  # Меню/курсор/геймплей проверяются автотестами в реальном Unity (workflow "Tests").
  # Сборка и релиз запускаются только после зелёных тестов.
  tests:
    name: Tests gate
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # ---------------------------------------------------------------- Windows
  # Основная платформа: отсюда же берётся артефакт для релиза.
  build-windows:
    name: Windows x64
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false           # модели хранятся обычным git; при переходе на LFS поставьте true
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Windows-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Windows-
            Library-

      - name: Free disk space
        run: |
          # образ редактора Unity 6 ~ 20 ГБ: без чистки раннеру не хватает места
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      # Активация Unity 6 Personal: лицензионный файл (.ulf) не работает в облаке —
      # он привязан к машине («Machine bindings don't match»), а ручная активация
      # Personal закрыта Unity. Рабочий путь: запрос места (seat) по аккаунту.
      # Ставим CLI из релизного архива по конкретной версии: install.sh тянет скрипт с
      # raw.githubusercontent.com и на раннерах упирается в rate-limit (403).
      - name: Install GameCI CLI
        run: |
          set -euo pipefail
          VERSION=v0.1.77
          curl -fsSL --retry 3 -o /tmp/game-ci.tar.gz \
            "https://github.com/game-ci/cli/releases/download/$VERSION/game-ci-linux-x64.tar.gz"
          mkdir -p "$HOME/.game-ci"
          tar -xzf /tmp/game-ci.tar.gz -C "$HOME/.game-ci"
          echo "$HOME/.game-ci" >> "$GITHUB_PATH"
          "$HOME/.game-ci/game-ci" --version

      - name: Activate Unity (Personal seat via account)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci activate --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-4.0.0

      - name: Build with Unity (Windows)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          game-ci build --engine unity --projectPath "$PROJECT_PATH" \
            --targetPlatform StandaloneWindows64 \
            --buildMethod NeonDistrict.EditorTools.CIBuild.BuildWindows \
            --buildsPath build --skipActivation \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-windows-mono-4.0.0

      - name: Return Unity license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci return-license --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-4.0.0 || true

      - name: Zip build
        if: always()
        run: |
          if [ -d build ]; then
            (cd build && zip -r ../NeonDistrict-Windows.zip . ) || true
            ls -la build
          fi
          ls -la NeonDistrict-Windows.zip 2>/dev/null || true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonDistrict-Windows
          path: |
            build/**
            NeonDistrict-Windows.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload editor log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log-windows
          path: |
            ~/.config/unity3d/Editor.log
            **/Editor.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Linux
  # Запускается только если Windows собрался: экономит минуты раннера.
  build-linux:
    name: Linux x64
    needs: [tests, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Linux-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Linux-
            Library-

      # Ставим CLI из релизного архива по конкретной версии: install.sh тянет скрипт с
      # raw.githubusercontent.com и на раннерах упирается в rate-limit (403).
      - name: Install GameCI CLI
        run: |
          set -euo pipefail
          VERSION=v0.1.77
          curl -fsSL --retry 3 -o /tmp/game-ci.tar.gz \
            "https://github.com/game-ci/cli/releases/download/$VERSION/game-ci-linux-x64.tar.gz"
          mkdir -p "$HOME/.game-ci"
          tar -xzf /tmp/game-ci.tar.gz -C "$HOME/.game-ci"
          echo "$HOME/.game-ci" >> "$GITHUB_PATH"
          "$HOME/.game-ci/game-ci" --version

      - name: Activate Unity (Personal seat via account)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci activate --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-4.0.0

      - name: Build with Unity (Linux)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          game-ci build --engine unity --projectPath "$PROJECT_PATH" \
            --targetPlatform StandaloneLinux64 \
            --buildMethod NeonDistrict.EditorTools.CIBuild.BuildLinux \
            --buildsPath build --skipActivation \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-linux-il2cpp-4.0.0

      - name: Return Unity license
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci return-license --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-${{ env.UNITY_VERSION }}-base-4.0.0 || true

      - name: Zip build
        if: always()
        run: |
          if [ -d build ]; then
            (cd build && zip -r ../NeonDistrict-Linux.zip . ) || true
          fi

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonDistrict-Linux
          path: |
            build/**
            NeonDistrict-Linux.zip
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------- Release
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack release
        run: |
          mkdir -p out
          for p in Windows Linux; do
            src="artifacts/NeonDistrict-$p"
            [ -d "$src" ] || continue
            if [ -f "$src/NeonDistrict-$p.zip" ]; then
              cp "$src/NeonDistrict-$p.zip" "out/NeonDistrict-$p.zip"
            else
              (cd "$src" && zip -r "../../out/NeonDistrict-$p.zip" .) || true
            fi
          done
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Neon District ${{ github.ref_name }}
          body: |
            Автоматическая сборка из коммита ${{ github.sha }}.

            * **Windows x64** — распакуйте `NeonDistrict-Windows.zip` и запустите `NeonDistrict.exe`
            * **Linux x64** — распакуйте `NeonDistrict-Linux.zip`, `chmod +x NeonDistrict.x86_64`, запустите
          files: out/*.zip
          draft: false
          prerelease: false
