name: Build (Windows / Linux)

# Сборка десктопных билдов Unity 6.3 LTS.
#
# ВАЖНО (см. README → CI/CD): для активации Unity нужны секреты репозитория
#   UNITY_LICENSE              — содержимое .ulf (Personal) ЛИБО
#   UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL (Pro/Plus)
# Без них job падает на шаге «Build with Unity» с сообщением
# «Missing Unity License File and no Serial was found».

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      unity_version:
        description: 'Версия Unity (например 6000.3.29f1)'
        required: false
        default: '6000.3.29f1'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: ${{ github.event.inputs.unity_version || '6000.3.29f1' }}
  PROJECT_PATH: '.'

jobs:
  # ---------------------------------------------------------------- Windows
  # Основная платформа: отсюда же берётся артефакт для релиза.
  build-windows:
    name: Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false           # модели хранятся обычным git; при переходе на LFS поставьте true
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Windows-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Windows-
            Library-

      - name: Free disk space
        run: |
          # образ редактора Unity 6 ~ 20 ГБ: без чистки раннеру не хватает места
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          projectPath: ${{ env.PROJECT_PATH }}
          buildMethod: NeonDistrict.EditorTools.CIBuild.BuildWindows
          allowDirtyBuild: true
          # game-ci кладёт билд в build/Windows64/...; наш CIBuild уважает -customBuildPath
          buildsPath: build

      - name: Zip build
        if: always()
        run: |
          if [ -d build ]; then
            (cd build && zip -r ../NeonDistrict-Windows.zip . ) || true
            ls -la build
          fi
          ls -la NeonDistrict-Windows.zip 2>/dev/null || true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonDistrict-Windows
          path: |
            build/**
            NeonDistrict-Windows.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload editor log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-log-windows
          path: |
            ~/.config/unity3d/Editor.log
            **/Editor.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------- Linux
  # Запускается только если Windows собрался: экономит минуты раннера.
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-Linux-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-Linux-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          projectPath: ${{ env.PROJECT_PATH }}
          buildMethod: NeonDistrict.EditorTools.CIBuild.BuildLinux
          allowDirtyBuild: true
          buildsPath: build

      - name: Zip build
        if: always()
        run: |
          if [ -d build ]; then
            (cd build && zip -r ../NeonDistrict-Linux.zip . ) || true
          fi

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NeonDistrict-Linux
          path: |
            build/**
            NeonDistrict-Linux.zip
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------- Release
  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack release
        run: |
          mkdir -p out
          for p in Windows Linux; do
            src="artifacts/NeonDistrict-$p"
            [ -d "$src" ] || continue
            if [ -f "$src/NeonDistrict-$p.zip" ]; then
              cp "$src/NeonDistrict-$p.zip" "out/NeonDistrict-$p.zip"
            else
              (cd "$src" && zip -r "../../out/NeonDistrict-$p.zip" .) || true
            fi
          done
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Neon District ${{ github.ref_name }}
          body: |
            Автоматическая сборка из коммита ${{ github.sha }}.

            * **Windows x64** — распакуйте `NeonDistrict-Windows.zip` и запустите `NeonDistrict.exe`
            * **Linux x64** — распакуйте `NeonDistrict-Linux.zip`, `chmod +x NeonDistrict.x86_64`, запустите
          files: out/*.zip
          draft: false
          prerelease: false
