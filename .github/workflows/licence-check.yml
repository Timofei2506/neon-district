name: License check (Unity Personal)

# Дешёвый эксперимент: проверяем, что Unity 6 Personal активируется по аккаунту
# (UNITY_EMAIL + UNITY_PASSWORD) новым game-ci CLI — без 40-минутной сборки.
# Запускается только вручную. После успеха этот workflow можно удалить.

on:
  workflow_dispatch:

jobs:
  activate:
    name: Activate Personal seat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Install GameCI CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/game-ci/cli/main/install.sh -o /tmp/game-ci-install.sh
          GAME_CI_INSTALL="$HOME/.game-ci/bin" GAME_CI_VERSION=v0.1.77 bash /tmp/game-ci-install.sh
          echo "$HOME/.game-ci/bin" >> "$GITHUB_PATH"
          "$HOME/.game-ci/bin/game-ci" --version

      - name: Activate Unity (account-based, no license file)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          game-ci activate --engine unity --unityLicensingMethod personal \
            --customImage unityci/editor:ubuntu-6000.3.29f1-base-4.0.0 --verbose

      - name: Report
        if: always()
        run: echo "activate finished with status ${{ job.status }}"
